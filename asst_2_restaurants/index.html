<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Dataset, Four Views</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js, for the Charts View. Pinned to one version so it can't change under you mid-semester. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>One Dataset, Four Views</h1>
            <p><strong>Project 2:</strong> The same data, shown four different ways. Each view emphasises different parts of the information and serves a different user goal.</p>
        </header>

        <nav class="view-selector">
            <button class="view-button active" id="btn-cards" data-view="cards">Card View</button>
            <button class="view-button" id="btn-table" data-view="table">Table View</button>
            <button class="view-button" id="btn-categories" data-view="categories">Category View</button>
            <button class="view-button" id="btn-charts" data-view="charts">Charts View</button>
        </nav>

        <main class="display-container">
            <div id="data-display">
                <div class="loading">Loading data...</div>
            </div>
        </main>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
